server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The service worker file must never be cached, or an updated app
    # version can't take over on a returning visit.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Hashed build assets (JS/CSS with content hashes in the filename,
    # both under /assets/ and the workbox runtime file at the root) are
    # safe to cache aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~ ^/workbox-.*\.js$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # No client-side router in this app today, but falling back to
    # index.html keeps a direct refresh/deep link working if one is
    # added later.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
